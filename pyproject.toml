[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-markdown"
version = "0.0.3"
description = "UI-Markdown — Interactive visual documents in pure plain text"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Filipe Alves" }
]
keywords = ["markdown", "ui", "documents", "interactive", "editor", "charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]

[project.scripts]
umd = "umd.cli:main"
uimd = "umd.cli:main"

[tool.setuptools]
packages = [
    "umd",
    "umd.components",
    "umd.core",
    "umd.document",
    "umd.markdown",
    "umd.renderers",
]

[tool.setuptools.package-dir]
umd = "."

[tool.setuptools.package-data]
umd = ["editor.html", "extension_template.js"]
